<!doctype html><html lang="ru"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1600px;background:#05070a;font-family:'IBM Plex Mono',monospace;color:#cfd6df;padding:28px}
h1{font-size:26px;letter-spacing:1px;color:#fff;margin-bottom:4px}
.sub{color:#6b7682;font-size:13px;margin-bottom:22px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px}
.tile{background:#0b0e13;border:1px solid #1c2230;border-radius:12px;overflow:hidden}
.tile .head{display:flex;justify-content:space-between;align-items:baseline;padding:9px 12px;border-bottom:1px solid #1c2230}
.tile .head b{font-size:12.5px;color:#fff;letter-spacing:.5px}
.tile .head span{font-size:10px;color:#6b7682}
canvas{display:block}
</style></head><body>
<h1>ACE//COACH — 20 AVATAR DIRECTIONS</h1>
<div class="sub">одна и та же подача · 20 стилей исполнения · выбери номер</div>
<div class="grid" id="grid"></div>
<script>
const W=372,H=300;
let seed=7;const rnd=()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const gauss=()=>(rnd()+rnd()+rnd()-1.5)/1.5;

// serve pose (original coords space ~ x380..710, y10..560)
const J={head:[520,166],neck:[520,214],rSho:[549,205],rElb:[586,142],rWri:[612,82],
 lSho:[489,218],lElb:[456,268],lWri:[443,326],hipC:[514,322],lHip:[494,322],rHip:[534,322],
 rKne:[556,408],rAnk:[576,494],lKne:[486,416],lAnk:[470,512],
 lFoot:[452,528],rFoot:[596,506]};
const RQ={cx:632,cy:36,rx:27,ry:36,rot:-0.42};
const LIMBS=[[J.neck,J.rSho,20],[J.neck,J.lSho,20],[J.rSho,J.rElb,21],[J.rElb,J.rWri,18],
 [J.lSho,J.lElb,21],[J.lElb,J.lWri,18],[J.lHip,J.lKne,26],[J.lKne,J.lAnk,22],
 [J.rHip,J.rKne,26],[J.rKne,J.rAnk,22],[J.lAnk,J.lFoot,16],[J.rAnk,J.rFoot,16],
 [J.rWri,[RQ.cx-16,RQ.cy+30],10]];
const BONES=LIMBS.map(l=>[l[0],l[1]]);
const S=0.42,TX=(W-302*S)/2-380*S+8,TY=(H-250)/2-4;
const T=(c)=>c.setTransform(S,0,0,S,TX,TY);
const R=()=>{const c=document.createElement('canvas');c.width=W;c.height=H;return c};

function silhouette(withRacquet=true){
  const c=R(),g=c.getContext('2d');T(g);
  g.fillStyle=g.strokeStyle='#fff';g.lineCap=g.lineJoin='round';
  g.beginPath();g.moveTo(...J.lSho);g.lineTo(...J.rSho);g.lineTo(...J.rHip);g.lineTo(...J.lHip);g.closePath();g.fill();
  for(const[a,b,w]of LIMBS){g.lineWidth=w;g.beginPath();g.moveTo(...a);g.lineTo(...b);g.stroke()}
  g.beginPath();g.arc(J.head[0],J.head[1],27,0,7);g.fill();
  if(withRacquet){g.lineWidth=7;g.beginPath();g.ellipse(RQ.cx,RQ.cy,RQ.rx,RQ.ry,RQ.rot,0,7);g.stroke()}
  return c;
}
function textured(patFn,withRq=true){ // pattern drawn full-bleed then masked by silhouette
  const c=R(),g=c.getContext('2d');patFn(g);
  g.globalCompositeOperation='destination-in';g.drawImage(silhouette(withRq),0,0);
  g.globalCompositeOperation='source-over';return c;
}
function paste(g,fig,glow=0,glowAlpha=.5){ // optional bloom
  if(glow){g.save();g.filter=`blur(${glow}px)`;g.globalAlpha=glowAlpha;g.drawImage(fig,0,0);g.restore()}
  g.drawImage(fig,0,0);
}
function floorRing(g,color,y=252){g.save();g.strokeStyle=color;g.lineWidth=1.2;
  g.beginPath();g.ellipse(W/2,y,92,14,0,0,7);g.stroke();
  g.globalAlpha=.4;g.setLineDash([4,6]);g.beginPath();g.ellipse(W/2,y,112,19,0,0,7);g.stroke();g.restore()}
function trail(g,color,alpha=.8){ // swing arc in tile space
  g.save();T(g);g.strokeStyle=color;g.lineCap='round';g.globalAlpha=alpha;
  g.shadowColor=color;g.shadowBlur=14;
  g.lineWidth=8;g.beginPath();g.moveTo(788,338);g.quadraticCurveTo(742,120,RQ.cx+8,RQ.cy+6);g.stroke();
  g.globalAlpha=alpha*.4;g.lineWidth=16;g.stroke();g.restore()}
function bg(g,c1,c2){const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,c1);gr.addColorStop(1,c2);
  g.fillStyle=gr;g.fillRect(0,0,W,H)}
function radialGlow(g,x,y,r,color){g.save();g.globalCompositeOperation='lighter';
  const gr=g.createRadialGradient(x,y,4,x,y,r);gr.addColorStop(0,color);gr.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=gr;g.fillRect(0,0,W,H);g.restore()}

const V=[]; const add=(name,sub,fn)=>V.push({name,sub,fn});

/* 01 LIQUID CHROME */
add("01 · LIQUID CHROME","molten metal / apple-ad",(g)=>{
  bg(g,'#0a0c10','#05060a');radialGlow(g,W/2,120,190,'rgba(160,180,210,.10)');
  const fig=textured(p=>{const gr=p.createLinearGradient(0,0,W,H);
    ['#e8edf4','#7d8augh'] ;const stops=[[0,'#dfe6ef'],[.18,'#8b97a8'],[.34,'#f4f8fd'],[.5,'#5a6474'],[.66,'#cfd8e4'],[.82,'#39414e'],[1,'#9aa5b4']];
    for(const[o,c]of stops)gr.addColorStop(o,c);p.fillStyle=gr;p.fillRect(0,0,W,H);});
  paste(g,fig,10,.35);floorRing(g,'rgba(190,205,225,.5)');});
/* 02 MARBLE STATUE */
add("02 · MARBLE STATUE","old money / gallery",(g)=>{
  bg(g,'#121110','#060505');radialGlow(g,W/2,90,220,'rgba(255,244,220,.09)');
  const fig=textured(p=>{p.fillStyle='#e9e4da';p.fillRect(0,0,W,H);
    p.strokeStyle='rgba(150,130,95,.5)';for(let i=0;i<26;i++){p.lineWidth=.7+rnd();p.beginPath();
      let x=rnd()*W,y=0;p.moveTo(x,y);for(let k=0;k<6;k++){x+=gauss()*26;y+=H/6;p.lineTo(x,y)}p.stroke()}
    const sh=p.createLinearGradient(0,0,W,0);sh.addColorStop(0,'rgba(0,0,0,.35)');sh.addColorStop(.45,'rgba(0,0,0,0)');sh.addColorStop(1,'rgba(0,0,0,.25)');
    p.fillStyle=sh;p.fillRect(0,0,W,H);});
  paste(g,fig,0);floorRing(g,'rgba(214,196,160,.55)')});
/* 03 EMERALD GLASS */
add("03 · EMERALD GLASS","racing green luxury",(g)=>{
  bg(g,'#03140b','#020a06');radialGlow(g,W/2,130,200,'rgba(60,220,140,.10)');
  const fig=textured(p=>{const gr=p.createLinearGradient(0,0,0,H);
    gr.addColorStop(0,'rgba(120,255,190,.85)');gr.addColorStop(.5,'rgba(20,120,70,.75)');gr.addColorStop(1,'rgba(6,50,30,.85)');
    p.fillStyle=gr;p.fillRect(0,0,W,H);});
  paste(g,fig,9,.55);
  const rim=textured(p=>{p.fillStyle='rgba(232,201,122,.9)';p.fillRect(0,0,W,H)});
  g.save();g.globalAlpha=.5;g.translate(-1.6,-1.6);g.globalCompositeOperation='lighter';g.drawImage(rim,0,0);g.restore();
  floorRing(g,'rgba(232,201,122,.5)')});
/* 04 NEON WIRE */
add("04 · NEON WIRE","pure tron / minimal",(g)=>{
  bg(g,'#04070c','#03050a');
  g.save();T(g);g.strokeStyle='#22d3ee';g.lineCap='round';g.shadowColor='#22d3ee';g.shadowBlur=12;g.lineWidth=3.4;
  for(const[a,b]of BONES){g.beginPath();g.moveTo(...a);g.lineTo(...b);g.stroke()}
  g.beginPath();g.arc(J.head[0],J.head[1],26,0,7);g.stroke();
  g.beginPath();g.ellipse(RQ.cx,RQ.cy,RQ.rx,RQ.ry,RQ.rot,0,7);g.stroke();
  g.fillStyle='#eafffe';for(const k in J){g.beginPath();g.arc(J[k][0],J[k][1],4.5,0,7);g.fill()}g.restore();
  floorRing(g,'rgba(34,211,238,.5)')});
/* 05 AURORA GLASS */
add("05 · AURORA GLASS","iridescent holo-foil",(g)=>{
  bg(g,'#07070d','#040409');radialGlow(g,W/2,110,210,'rgba(150,120,255,.10)');
  const fig=textured(p=>{const gr=p.createLinearGradient(0,0,W,H);
    gr.addColorStop(0,'#8df0ff');gr.addColorStop(.3,'#b18cff');gr.addColorStop(.55,'#ff9ad5');gr.addColorStop(.8,'#8dffc8');gr.addColorStop(1,'#8df0ff');
    p.fillStyle=gr;p.fillRect(0,0,W,H);p.globalAlpha=.35;p.fillStyle='#fff';p.fillRect(0,0,W,H*.16)});
  paste(g,fig,12,.5);floorRing(g,'rgba(177,140,255,.5)')});
/* 06 CARBON STEALTH */
add("06 · CARBON STEALTH","supercar / matte black",(g)=>{
  bg(g,'#0d0f12','#050608');
  const fig=textured(p=>{p.fillStyle='#232830';p.fillRect(0,0,W,H);
    const top=p.createLinearGradient(0,0,0,H);top.addColorStop(0,'rgba(190,205,220,.30)');top.addColorStop(.4,'rgba(0,0,0,0)');
    p.fillStyle=top;p.fillRect(0,0,W,H);
    p.strokeStyle='rgba(255,255,255,.10)';p.lineWidth=2;
    for(let i=-H;i<W;i+=7){p.beginPath();p.moveTo(i,0);p.lineTo(i+H,H);p.stroke()}
    for(let i=0;i<W+H;i+=7){p.beginPath();p.moveTo(i,0);p.lineTo(i-H,H);p.stroke()}});
  paste(g,fig,0);
  const edge=textured(p=>{const gr=p.createLinearGradient(0,0,W,0);
    gr.addColorStop(0,'rgba(255,90,40,0)');gr.addColorStop(.75,'rgba(255,90,40,0)');gr.addColorStop(1,'rgba(255,110,50,.95)');
    p.fillStyle=gr;p.fillRect(0,0,W,H)});
  g.save();g.globalCompositeOperation='lighter';g.drawImage(edge,0,0);g.restore();
  trail(g,'rgba(255,110,50,.8)',.5);floorRing(g,'rgba(255,110,50,.35)')});
/* 07 WHITE PARTICLE */
add("07 · WHITE PARTICLE","apple keynote / clean",(g)=>{
  bg(g,'#08090c','#040507');
  g.save();T(g);g.globalCompositeOperation='lighter';
  const dot=(x,y,r,a)=>{g.globalAlpha=a*.12;g.fillStyle='#dfe9ff';g.beginPath();g.arc(x,y,r*3,0,7);g.fill();
    g.globalAlpha=a;g.beginPath();g.arc(x,y,r,0,7);g.fill()};
  for(const[a,b]of BONES)for(let i=0;i<70;i++){const t=rnd();
    dot(a[0]+(b[0]-a[0])*t+gauss()*4,a[1]+(b[1]-a[1])*t+gauss()*4,.8+rnd()*2.2,.4+rnd()*.6)}
  for(let i=0;i<200;i++){const u=rnd(),v=rnd();
    const tx=J.lSho[0]+(J.rSho[0]-J.lSho[0])*u, ty=J.lSho[1]+(J.rSho[1]-J.lSho[1])*u;
    const bx=J.lHip[0]+(J.rHip[0]-J.lHip[0])*u, by=J.lHip[1]+(J.rHip[1]-J.lHip[1])*u;
    dot(tx+(bx-tx)*v+gauss()*3,ty+(by-ty)*v+gauss()*3,.7+rnd()*2,.35+rnd()*.6)}
  for(let i=0;i<130;i++){const an=rnd()*7,rr=Math.sqrt(rnd())*25;dot(J.head[0]+Math.cos(an)*rr,J.head[1]+Math.sin(an)*rr,.7+rnd()*1.8,.4+rnd()*.6)}
  for(let i=0;i<120;i++){const an=rnd()*7;dot(RQ.cx+Math.cos(an)*RQ.rx*Math.cos(RQ.rot)-Math.sin(an)*RQ.ry*Math.sin(RQ.rot),
    RQ.cy+Math.cos(an)*RQ.rx*Math.sin(RQ.rot)+Math.sin(an)*RQ.ry*Math.cos(RQ.rot),.8+rnd()*1.6,.5+rnd()*.5)}
  g.restore();floorRing(g,'rgba(200,215,240,.4)')});
/* 08 LIGHT TRAILS */
add("08 · LIGHT TRAILS","long exposure / motion",(g)=>{
  bg(g,'#050508','#020204');
  const sil=silhouette();g.save();g.globalAlpha=.10;g.drawImage(sil,0,0);g.restore();
  g.save();T(g);g.lineCap='round';g.globalCompositeOperation='lighter';
  const arcs=[['#ffd76a',[820,420],[760,150],[RQ.cx,RQ.cy],9],
              ['#ffb14d',[800,470],[720,220],[600,60],6],
              ['#fff3c8',[840,380],[790,120],[650,30],3.5],
              ['#c8ff00',[760,500],[700,300],[612,82],2.5]];
  for(const[c,p0,p1,p2,w]of arcs){g.strokeStyle=c;g.shadowColor=c;g.shadowBlur=18;
    g.lineWidth=w;g.globalAlpha=.85;g.beginPath();g.moveTo(...p0);g.quadraticCurveTo(...p1,...p2);g.stroke();
    g.globalAlpha=.25;g.lineWidth=w*2.6;g.stroke()}
  g.restore();floorRing(g,'rgba(255,215,106,.4)')});
/* 09 GLITCH HOLO */
add("09 · GLITCH HOLO","rgb split / cyber",(g)=>{
  bg(g,'#05060c','#030309');
  const cy=textured(p=>{p.fillStyle='rgba(64,240,255,.9)';p.fillRect(0,0,W,H)});
  const mg=textured(p=>{p.fillStyle='rgba(255,70,200,.85)';p.fillRect(0,0,W,H)});
  const wh=textured(p=>{p.fillStyle='rgba(230,250,255,.9)';p.fillRect(0,0,W,H)});
  g.save();g.globalCompositeOperation='lighter';
  g.globalAlpha=.6;g.drawImage(cy,-3,0);g.drawImage(mg,3,1);g.globalAlpha=.9;g.drawImage(wh,0,0);g.restore();
  seed=99;for(let i=0;i<7;i++){const y=20+rnd()*230,h=3+rnd()*9,dx=(rnd()*2-1)*22;
    const slice=g.getImageData(0,y,W,h);g.putImageData(slice,dx,y)}
  g.save();g.globalAlpha=.16;g.fillStyle='#8ff';for(let y=0;y<H;y+=3)g.fillRect(0,y,W,1);g.restore();
  floorRing(g,'rgba(64,240,255,.45)')});
/* 10 BLUEPRINT */
add("10 · BLUEPRINT","da vinci / engineering",(g)=>{
  bg(g,'#071c30','#051526');
  g.save();g.strokeStyle='rgba(140,190,235,.12)';g.lineWidth=1;
  for(let x=0;x<W;x+=24){g.beginPath();g.moveTo(x,0);g.lineTo(x,H);g.stroke()}
  for(let y=0;y<H;y+=24){g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke()}g.restore();
  g.save();T(g);g.strokeStyle='#bfe0ff';g.lineWidth=2.4;g.lineCap='round';
  for(const[a,b]of BONES){g.beginPath();g.moveTo(...a);g.lineTo(...b);g.stroke()}
  g.beginPath();g.arc(J.head[0],J.head[1],26,0,7);g.stroke();
  g.beginPath();g.ellipse(RQ.cx,RQ.cy,RQ.rx,RQ.ry,RQ.rot,0,7);g.stroke();
  g.setLineDash([5,7]);g.strokeStyle='rgba(140,190,235,.6)';g.lineWidth=1.4;
  g.beginPath();g.arc(J.rSho[0],J.rSho[1],86,-1.9,-0.3);g.stroke();
  g.beginPath();g.arc(J.hipC[0],J.hipC[1],120,-.6,.9);g.stroke();g.setLineDash([]);
  g.fillStyle='#eaf5ff';for(const k of['rSho','rElb','rWri','hipC','rKne'])
    {g.beginPath();g.arc(J[k][0],J[k][1],5,0,7);g.fill();g.beginPath();g.arc(J[k][0],J[k][1],11,0,7);g.stroke()}
  g.font='22px IBM Plex Mono';g.fillStyle='rgba(190,225,255,.85)';
  g.fillText('θ=137°',J.rElb[0]+26,J.rElb[1]-8);g.fillText('x-factor 44°',J.hipC[0]+120,J.hipC[1]+40);
  g.fillText('v=126 km/h',RQ.cx-210,RQ.cy+18);g.restore();
  floorRing(g,'rgba(140,190,235,.45)')});
/* 11 TOPO LINES */
add("11 · TOPO LINES","contour map",(g)=>{
  bg(g,'#071009','#040a06');
  const fig=textured(p=>{p.strokeStyle='#d4ff2e';p.lineWidth=2.4;
    for(let y=0;y<H;y+=5){p.globalAlpha=.75+.25*Math.sin(y*.4);p.beginPath();
      p.moveTo(0,y+Math.sin(y*.7)*1.5);p.lineTo(W,y+Math.cos(y*.5)*1.5);p.stroke()}});
  paste(g,fig,9,.7);floorRing(g,'rgba(200,255,0,.4)')});
/* 12 CRYSTAL LOW-POLY */
add("12 · CRYSTAL LOW-POLY","ice facets / diamond",(g)=>{
  bg(g,'#070b12','#04070d');radialGlow(g,W/2,120,200,'rgba(140,190,255,.08)');
  const fig=textured(p=>{const gr=p.createLinearGradient(0,0,0,H);
    gr.addColorStop(0,'#dff2ff');gr.addColorStop(.5,'#7fb4e8');gr.addColorStop(1,'#31547e');
    p.fillStyle=gr;p.fillRect(0,0,W,H);seed=55;
    for(let i=0;i<70;i++){const x=rnd()*W,y=rnd()*H,r=8+rnd()*26;
      p.globalAlpha=.16+rnd()*.2;p.fillStyle=rnd()<.5?'#fff':'#274a75';
      p.beginPath();p.moveTo(x,y-r);p.lineTo(x+r*.9,y+r*.6);p.lineTo(x-r*.9,y+r*.5);p.closePath();p.fill()}});
  paste(g,fig,8,.4);floorRing(g,'rgba(160,205,255,.5)')});
/* 13 GOLD WIRE */
add("13 · GOLD WIRE","single-line sculpture",(g)=>{
  bg(g,'#0c0a07','#060504');radialGlow(g,W/2,120,190,'rgba(230,200,120,.07)');
  g.save();T(g);g.lineCap='round';
  g.strokeStyle='#e6c87a';g.shadowColor='rgba(230,200,122,.8)';g.shadowBlur=6;
  for(const[a,b]of BONES){g.lineWidth=3;g.beginPath();g.moveTo(...a);g.lineTo(...b);g.stroke();
    g.lineWidth=1.2;g.strokeStyle='#fff3d6';
    g.beginPath();g.moveTo(a[0]+6,a[1]+6);g.lineTo(b[0]+6,b[1]+6);g.stroke();g.strokeStyle='#e6c87a'}
  g.lineWidth=3;g.beginPath();g.arc(J.head[0],J.head[1],26,.4,6.6);g.stroke();
  g.beginPath();g.ellipse(RQ.cx,RQ.cy,RQ.rx,RQ.ry,RQ.rot,0,7);g.stroke();g.restore();
  floorRing(g,'rgba(230,200,122,.5)')});
/* 14 THERMAL */
add("14 · THERMAL","infrared / sports-science",(g)=>{
  bg(g,'#0b0616','#05030c');
  const fig=textured(p=>{
    const P2=(pt)=>[pt[0]*S+TX,pt[1]*S+TY]; // joint -> tile space (no ctx transform!)
    const heat=(pt,r,c)=>{const[x,y]=P2(pt);const gr=p.createRadialGradient(x,y,2,x,y,r*S);
      gr.addColorStop(0,c);gr.addColorStop(1,'rgba(40,10,80,0)');p.fillStyle=gr;p.fillRect(0,0,W,H)};
    p.fillStyle='#2a0f5e';p.fillRect(0,0,W,H);p.globalCompositeOperation='lighter';
    heat(J.hipC,190,'rgba(255,80,40,.95)');heat(J.rSho,150,'rgba(255,160,40,.95)');
    heat(J.rElb,100,'rgba(255,230,120,.95)');heat(J.rWri,80,'rgba(255,255,220,.98)');
    heat(J.head,90,'rgba(255,140,60,.9)');heat(J.lKne,100,'rgba(230,60,120,.85)');
    heat(J.rKne,100,'rgba(230,60,120,.85)');heat(J.lAnk,70,'rgba(160,40,140,.8)');heat(J.rAnk,70,'rgba(160,40,140,.8)')});
  paste(g,fig,6,.5);floorRing(g,'rgba(255,120,60,.4)')});
/* 15 HALFTONE */
add("15 · HALFTONE","editorial print",(g)=>{
  bg(g,'#0e0e10','#08080a');
  const mask=silhouette();const md=mask.getContext('2d').getImageData(0,0,W,H).data;
  g.fillStyle='#f2f2ef';
  for(let y=2;y<H;y+=6)for(let x=2;x<W;x+=6){const a=md[(y*W+x)*4+3];if(a>40){
    const r=(a/255)*(2.6-((y/H)*1.1));g.beginPath();g.arc(x,y,Math.max(.5,r),0,7);g.fill()}}
  g.fillStyle='#c8ff00';
  for(let y=2;y<H;y+=6)for(let x=2;x<W;x+=6){const a=md[(y*W+x)*4+3];
    if(a>40&&x>W*.62){g.beginPath();g.arc(x,y,1.3,0,7);g.fill()}}
  floorRing(g,'rgba(240,240,235,.35)')});
/* 16 SMOKE */
add("16 · SMOKE","vapor dissolve",(g)=>{
  bg(g,'#0a0c0e','#050607');
  const fig=textured(p=>{const gr=p.createLinearGradient(0,0,0,H);
    gr.addColorStop(0,'rgba(210,230,235,.25)');gr.addColorStop(.55,'rgba(190,215,225,.8)');gr.addColorStop(1,'rgba(160,190,200,.95)');
    p.fillStyle=gr;p.fillRect(0,0,W,H)});
  paste(g,fig,5,.6);
  g.save();g.globalCompositeOperation='lighter';seed=31;
  for(let i=0;i<60;i++){const t=rnd(),x=W*.38+t*90+gauss()*30,y=40+t*120+gauss()*22;
    g.globalAlpha=.05+rnd()*.08;g.filter='blur(6px)';g.fillStyle='#cfe4ea';
    g.beginPath();g.arc(x+ (rnd()*40),y-rnd()*60,6+rnd()*16,0,7);g.fill()}
  g.restore();floorRing(g,'rgba(190,215,225,.3)')});
/* 17 VAPORWAVE */
add("17 · VAPORWAVE","retro sunset chrome",(g)=>{
  const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#1a0b33');gr.addColorStop(.6,'#3d1054');gr.addColorStop(1,'#0d0620');
  g.fillStyle=gr;g.fillRect(0,0,W,H);
  g.save();g.strokeStyle='rgba(255,80,200,.35)';g.lineWidth=1;
  for(let i=0;i<10;i++){const y=190+i*i*1.6;g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke()}
  for(let x=-W;x<W*2;x+=46){g.beginPath();g.moveTo(W/2+(x-W/2)*.25,190);g.lineTo(x,H);g.stroke()}g.restore();
  radialGlow(g,W/2,96,120,'rgba(255,140,60,.35)');
  const fig=textured(p=>{const fg=p.createLinearGradient(0,0,0,H);
    fg.addColorStop(0,'#ffd9a0');fg.addColorStop(.45,'#ff7bc8');fg.addColorStop(1,'#6a4bff');
    p.fillStyle=fg;p.fillRect(0,0,W,H)});
  paste(g,fig,9,.5)});
/* 18 CONSTELLATION */
add("18 · CONSTELLATION","star map / astro",(g)=>{
  bg(g,'#05070f','#02030a');seed=77;
  g.fillStyle='#9db4e8';for(let i=0;i<130;i++){g.globalAlpha=.15+rnd()*.5;
    g.beginPath();g.arc(rnd()*W,rnd()*H,rnd()*1.3,0,7);g.fill()}g.globalAlpha=1;
  g.save();T(g);g.strokeStyle='rgba(180,205,255,.5)';g.lineWidth=1.6;
  for(const[a,b]of BONES){g.beginPath();g.moveTo(...a);g.lineTo(...b);g.stroke()}
  g.beginPath();g.ellipse(RQ.cx,RQ.cy,RQ.rx,RQ.ry,RQ.rot,0,7);g.stroke();
  for(const k in J){const[x,y]=J[k];g.fillStyle='#fff';g.shadowColor='#bcd4ff';g.shadowBlur=14;
    g.beginPath();g.arc(x,y,k==='head'?7:5,0,7);g.fill();
    g.save();g.strokeStyle='rgba(255,255,255,.75)';g.lineWidth=1;
    g.beginPath();g.moveTo(x-11,y);g.lineTo(x+11,y);g.moveTo(x,y-11);g.lineTo(x,y+11);g.stroke();g.restore()}
  g.restore();floorRing(g,'rgba(157,180,232,.4)')});
/* 19 DATA COUTURE */
add("19 · DATA COUTURE","typography fill",(g)=>{
  bg(g,'#0a0b0d','#060708');
  const fig=textured(p=>{p.fillStyle='#0f1114';p.fillRect(0,0,W,H);
    p.font='9px IBM Plex Mono';const words=['ACE','NTRP 4.0','SERVE','126KM/H','X-44°','TOPSPIN','SPLIT-STEP','Δ0.5','COACH','40-15'];
    seed=13;for(let y=8;y<H;y+=10){let x=2;while(x<W){const w=words[Math.floor(rnd()*words.length)];
      p.fillStyle=rnd()<.14?'#c8ff00':(rnd()<.3?'#eafff1':'#3f8a5e');p.fillText(w,x,y);x+=w.length*6+8}}});
  paste(g,fig,0);floorRing(g,'rgba(200,255,0,.35)')});
/* 20 INK SUMI-E */
add("20 · INK SUMI-E","brush / zen minimal",(g)=>{
  bg(g,'#f2ede2','#e9e2d2');
  g.save();g.fillStyle='#c33';g.beginPath();g.arc(W-58,52,20,0,7);g.fill();g.restore();
  g.save();T(g);g.lineCap='round';g.strokeStyle='#17171a';seed=5;
  for(const[a,b,w]of LIMBS){const n=3;
    for(let k=0;k<n;k++){g.globalAlpha=.5+rnd()*.5;g.lineWidth=(w*.55)*(1-k*.24)+rnd()*3;
      g.beginPath();g.moveTo(a[0]+gauss()*3,a[1]+gauss()*3);
      g.quadraticCurveTo((a[0]+b[0])/2+gauss()*8,(a[1]+b[1])/2+gauss()*8,b[0]+gauss()*3,b[1]+gauss()*3);g.stroke()}}
  g.globalAlpha=.92;g.fillStyle='#17171a';g.beginPath();g.arc(J.head[0],J.head[1],24,0,7);g.fill();
  g.globalAlpha=.85;g.lineWidth=5;g.beginPath();g.ellipse(RQ.cx,RQ.cy,RQ.rx,RQ.ry,RQ.rot,0,7);g.stroke();
  g.globalAlpha=.5;g.lineWidth=2;g.beginPath();g.moveTo(788,338);g.quadraticCurveTo(742,120,RQ.cx+8,RQ.cy+6);g.stroke();
  seed=21;g.fillStyle='#17171a';for(let i=0;i<26;i++){g.globalAlpha=.15+rnd()*.4;
    g.beginPath();g.arc(600+gauss()*140,300+gauss()*160,1+rnd()*2.5,0,7);g.fill()}
  g.restore();
  g.fillStyle='#8a8172';g.font='10px IBM Plex Mono';g.fillText('間 — ma · space between strokes',14,H-12)});

const grid=document.getElementById('grid');
for(const v of V){seed=1000+V.indexOf(v);
  const tile=document.createElement('div');tile.className='tile';
  tile.innerHTML=`<div class="head"><b>${v.name}</b><span>${v.sub}</span></div>`;
  const c=document.createElement('canvas');c.width=W;c.height=H;tile.appendChild(c);
  const g=c.getContext('2d');try{v.fn(g)}catch(e){g.fillStyle='#300';g.fillRect(0,0,W,H);g.fillStyle='#f88';g.fillText(String(e),10,20)}
  grid.appendChild(tile)}
</script>
