<!doctype html><html lang="ru"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1440px;height:900px;background:#000;font-family:'IBM Plex Mono',monospace;overflow:hidden;
  display:flex;align-items:center;justify-content:center}
.term{width:1408px;height:868px;background:#03120a;position:relative;overflow:hidden;border-radius:2px;
  box-shadow:inset 0 0 200px rgba(0,0,0,.7),inset 0 0 60px rgba(78,240,138,.05)}
.term:before{content:"";position:absolute;inset:0;
  background:linear-gradient(rgba(78,240,138,.045) 1px,transparent 1px),
             linear-gradient(90deg,rgba(78,240,138,.045) 1px,transparent 1px);background-size:34px 34px}
.viewport{position:absolute;inset:24px;border:1px solid rgba(200,255,0,.28);border-radius:2px;
  background:rgba(78,240,138,.02);overflow:hidden}
.cor{position:absolute;width:18px;height:18px;z-index:5}
.cor.tl{top:-1px;left:-1px;border-top:2px solid #c8ff00;border-left:2px solid #c8ff00}
.cor.tr{top:-1px;right:-1px;border-top:2px solid #c8ff00;border-right:2px solid #c8ff00}
.cor.bl{bottom:-1px;left:-1px;border-bottom:2px solid #c8ff00;border-left:2px solid #c8ff00}
.cor.br{bottom:-1px;right:-1px;border-bottom:2px solid #c8ff00;border-right:2px solid #c8ff00}
.vstatus{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;
  padding:10px 14px;font-size:11px;color:#3f8a5e;border-bottom:1px solid rgba(78,240,138,.2);z-index:4}
.vstatus .hl{color:#e6c87a}
.transcript{position:absolute;left:0;right:0;bottom:0;background:rgba(3,18,10,.72);
  border-top:1px solid rgba(78,240,138,.2);padding:12px 16px;font-size:13px;color:#cfeede;z-index:4}
.transcript b{color:#c8ff00;font-weight:600}
.curs{display:inline-block;width:8px;height:14px;background:#c8ff00;vertical-align:-2px;margin-left:3px}
canvas{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%)}
.tag{position:absolute;bottom:64px;left:16px;font-size:10px;letter-spacing:2px;color:#235f3e;z-index:4}
.ret{position:absolute;color:#173f29;font-size:12px;z-index:4}
.ret.tl{top:42px;left:14px}.ret.tr{top:42px;right:14px}
</style></head><body>
<div class="term"><div class="viewport">
  <span class="cor tl"></span><span class="cor tr"></span><span class="cor bl"></span><span class="cor br"></span>
  <div class="vstatus"><span>&gt; render: live · holo: <span class="hl">GOLD_GHOST</span> · particles: 4.2k · fps 60</span><span>COACH.AGENT — v3.0 █</span></div>
  <span class="ret tl">+</span><span class="ret tr">+</span>
  <canvas id="c" width="1100" height="720"></canvas>
  <div class="tag">GOLD GHOST · SERVE LOOP · 0.25×</div>
  <div class="transcript"><b>&gt; coach:</b> Watch the toss — full extension, hips through the ball. That's the money position.<span class="curs"></span></div>
</div></div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let s=42;const rnd=()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const gauss=()=>(rnd()+rnd()+rnd()-1.5)/1.5;

// serve contact pose (hand-tuned), canvas coords
const J={head:[520,166],neck:[520,214],rSho:[549,205],rElb:[586,142],rWri:[612,82],
 lSho:[489,218],lElb:[456,268],lWri:[443,326],hipC:[514,322],lHip:[494,322],rHip:[534,322],
 rKne:[556,408],rAnk:[576,494],lKne:[486,416],lAnk:[470,512]};
const RQ={cx:632,cy:36,rx:27,ry:36,rot:-0.42}; // racquet head
const GROUND_Y=596;

const golds=['#e8c97e','#d9b459','#c9a227','#f2dfae'];
const ivory='#fff3d6',lime='#c8ff00',amber='#a8842e';
const pick=(arr)=>arr[Math.floor(rnd()*arr.length)];
function col(limeChance=0.02){const r=rnd();if(r<limeChance)return lime;if(r<limeChance+0.13)return ivory;if(r>0.92)return amber;return pick(golds)}

const P=[]; // particles {x,y,r,c,a}
function bone(a,b,n,sig,limeC=0.02,rmax=2.4){for(let i=0;i<n;i++){const t=rnd();
  const x=a[0]+(b[0]-a[0])*t, y=a[1]+(b[1]-a[1])*t;
  P.push({x:x+gauss()*sig,y:y+gauss()*sig,r:.7+rnd()*rmax,c:col(limeC),a:.55+rnd()*.45})}}
function disc(cx,cy,R,n,limeC=0.02){for(let i=0;i<n;i++){const an=rnd()*6.283,rr=Math.sqrt(rnd())*R;
  P.push({x:cx+Math.cos(an)*rr,y:cy+Math.sin(an)*rr*1.12,r:.7+rnd()*2.2,c:col(limeC),a:.5+rnd()*.5})}}
function poly(pts,n){ // torso fill
  const [p0,p1,p2,p3]=pts;for(let i=0;i<n;i++){const u=rnd(),v=rnd();
  const top=[p0[0]+(p1[0]-p0[0])*u,p0[1]+(p1[1]-p0[1])*u];
  const bot=[p3[0]+(p2[0]-p3[0])*u,p3[1]+(p2[1]-p3[1])*u];
  P.push({x:top[0]+(bot[0]-top[0])*v+gauss()*3,y:top[1]+(bot[1]-top[1])*v+gauss()*3,
    r:.6+rnd()*2.1,c:col(.015),a:.4+rnd()*.5})}}

// build figure
disc(...J.head,24,240,.01);
bone(J.neck,J.rSho,60,4);bone(J.neck,J.lSho,60,4);
poly([J.lSho,J.rSho,J.rHip,J.lHip],520);
bone(J.rSho,J.rElb,110,4.6,.05);bone(J.rElb,J.rWri,120,4.2,.22,2.7); // hitting arm hotter
bone(J.lSho,J.lElb,95,4.4);bone(J.lElb,J.lWri,90,4);
bone(J.lHip,J.rHip,50,4);
bone(J.rHip,J.rKne,120,5);bone(J.rKne,J.rAnk,110,4.4);
bone(J.lHip,J.lKne,120,5);bone(J.lKne,J.lAnk,110,4.4);
bone(J.lAnk,[452,528],36,3);bone(J.rAnk,[596,506],36,3); // feet
// racquet: ring + strings, gold wire with lime rim
for(let i=0;i<230;i++){const an=rnd()*6.283;
  const ex=Math.cos(an)*RQ.rx,ey=Math.sin(an)*RQ.ry;
  const x=RQ.cx+ex*Math.cos(RQ.rot)-ey*Math.sin(RQ.rot),y=RQ.cy+ex*Math.sin(RQ.rot)+ey*Math.cos(RQ.rot);
  P.push({x:x+gauss()*1.6,y:y+gauss()*1.6,r:.8+rnd()*1.8,c:rnd()<.3?lime:pick(golds),a:.7+rnd()*.3})}
for(let i=0;i<70;i++){const ex=(rnd()*2-1)*RQ.rx*.75,ey=(rnd()*2-1)*RQ.ry*.75;
  if((ex/RQ.rx)**2+(ey/RQ.ry)**2>0.68)continue;
  const x=RQ.cx+ex*Math.cos(RQ.rot)-ey*Math.sin(RQ.rot),y=RQ.cy+ex*Math.sin(RQ.rot)+ey*Math.cos(RQ.rot);
  P.push({x,y,r:.5+rnd()*.9,c:ivory,a:.25+rnd()*.3})}
bone(J.rWri,[RQ.cx-14,RQ.cy+26],46,2.4,.3); // grip
// ball above racquet
disc(668,16,7,40,.0);P.push({x:668,y:16,r:5,c:ivory,a:1});

// racquet swing TRAIL (cyberpunk lime sweep): bezier from behind-low to racquet
function bez(t,p0,p1,p2){const a=(1-t)**2,b=2*(1-t)*t,c=t*t;
  return [a*p0[0]+b*p1[0]+c*p2[0], a*p0[1]+b*p1[1]+c*p2[1]]}
const T0=[788,338],T1=[742,120],T2=[RQ.cx+8,RQ.cy+6];
const trail=[];for(let i=0;i<340;i++){const t=rnd();const [x,y]=bez(t,T0,T1,T2);
  trail.push({x:x+gauss()*(10-8*t),y:y+gauss()*(10-8*t),r:(.5+rnd()*2.6)*(0.35+.65*t),
    c:rnd()<.82?lime:'#eaffa0',a:(.08+.72*t)*(.5+rnd()*.5)})}
// motion echoes of hitting arm (ghost copies)
function echo(dx,dy,alpha){[[J.rSho,J.rElb],[J.rElb,J.rWri]].forEach(([a,b])=>{
  for(let i=0;i<38;i++){const t=rnd();
    trail.push({x:a[0]+(b[0]-a[0])*t+dx+gauss()*3,y:a[1]+(b[1]-a[1])*t+dy+gauss()*3,
      r:.6+rnd()*1.6,c:pick(golds),a:alpha*(.4+rnd()*.6)})}})}
echo(26,34,.16);echo(50,66,.08);

function drawAll(g,scale=1){
  g.globalCompositeOperation='lighter';
  const all=P.concat(trail);
  for(const p of all){ // halo
    g.globalAlpha=p.a*.10;g.fillStyle=p.c;g.beginPath();g.arc(p.x,p.y,p.r*3.4*scale,0,6.283);g.fill()}
  for(const p of all){ // core
    g.globalAlpha=p.a*.9;g.fillStyle=p.c;g.beginPath();g.arc(p.x,p.y,p.r*scale,0,6.283);g.fill()}
  g.globalAlpha=1;g.globalCompositeOperation='source-over';
}

// ground: gold orbit rings + glow
function ground(g){
  g.save();g.globalCompositeOperation='lighter';
  const grd=g.createRadialGradient(520,GROUND_Y,10,520,GROUND_Y,240);
  grd.addColorStop(0,'rgba(212,175,55,.28)');grd.addColorStop(.5,'rgba(78,240,138,.07)');grd.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=grd;g.beginPath();g.ellipse(520,GROUND_Y,250,44,0,0,6.283);g.fill();
  g.strokeStyle='rgba(230,200,122,.55)';g.lineWidth=1.4;
  g.beginPath();g.ellipse(520,GROUND_Y,196,30,0,0,6.283);g.stroke();
  g.strokeStyle='rgba(230,200,122,.22)';g.setLineDash([5,7]);
  g.beginPath();g.ellipse(520,GROUND_Y,238,38,0,0,6.283);g.stroke();
  g.setLineDash([]);g.restore();
}

// render: offscreen figure -> bloom + sharp + reflection
const off=document.createElement('canvas');off.width=cv.width;off.height=cv.height;
const og=off.getContext('2d');og.save();og.translate(0,34);drawAll(og);og.restore();
ground(ctx);
ctx.save();ctx.filter='blur(10px)';ctx.globalAlpha=.55;ctx.drawImage(off,0,0);ctx.restore(); // bloom
ctx.drawImage(off,0,0); // sharp
// reflection (old-money polished floor)
ctx.save();ctx.translate(0,GROUND_Y*2+14);ctx.scale(1,-1);ctx.globalAlpha=.10;ctx.filter='blur(2px)';
ctx.drawImage(off,0,0);ctx.restore();
const fade=ctx.createLinearGradient(0,GROUND_Y,0,GROUND_Y+130);
fade.addColorStop(0,'rgba(3,18,10,0)');fade.addColorStop(1,'rgba(3,18,10,1)');
ctx.fillStyle=fade;ctx.fillRect(0,GROUND_Y,cv.width,140);
</script>
</body></html>
